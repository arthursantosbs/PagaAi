# Blueprint do Render.
#
# Este arquivo precisa ficar na RAIZ do repositorio: e onde o Render procura por
# padrao. Como o codigo do app vive em pagaai/, os caminhos abaixo apontam para la.
# dockerfilePath e dockerContext sao sempre relativos a raiz do repositorio,
# nunca a posicao deste arquivo.
#
# Se o Render reclamar do formato, confira o schema atual em
# https://render.com/docs/blueprint-spec — ele muda de tempos em tempos. O caminho
# manual funciona igual: New > Web Service > Docker, com Root Directory = pagaai,
# e depois preencher as mesmas variaveis de ambiente na mao.

# NAO criamos banco aqui de proposito.
#
# O Postgres gratuito do Render EXPIRA 30 dias depois de criado e depois e
# APAGADO com os dados dentro. Para um sistema que registra quem deve dinheiro,
# isso e inaceitavel.
#
# Em vez disso, use um Postgres gerenciado que nao expira (Neon tem plano
# gratuito permanente) e informe a conexao em DB_URL, DB_USER e DB_PASSWORD
# no painel do Render. Passo a passo no DEPLOY.md.

services:
  - type: web
    name: paga-ai
    runtime: docker
    dockerfilePath: ./pagaai/Dockerfile
    dockerContext: ./pagaai
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # sync: false = o Render pergunta na hora de aplicar e guarda so no painel.
      # Nada disso entra no repositorio.
      #
      # DB_URL vem do Neon, no formato JDBC e COM sslmode=require:
      #   jdbc:postgresql://ep-xxx.sa-east-1.aws.neon.tech/pagaai?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_LOGIN
        value: HERA123
      # sync: false = o Render pergunta o valor na hora de aplicar o blueprint
      # e guarda so no painel. A senha nao entra no repositorio.
      - key: ADMIN_SENHA
        sync: false
