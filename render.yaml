# Blueprint do Render.
#
# Este arquivo precisa ficar na RAIZ do repositorio: e onde o Render procura por
# padrao. Como o codigo do app vive em pagaai/, os caminhos abaixo apontam para la.
# dockerfilePath e dockerContext sao sempre relativos a raiz do repositorio,
# nunca a posicao deste arquivo.
#
# Se o Render reclamar do formato, confira o schema atual em
# https://render.com/docs/blueprint-spec — ele muda de tempos em tempos. O caminho
# manual funciona igual: New > Web Service > Docker, com Root Directory = pagaai,
# e depois preencher as mesmas variaveis de ambiente na mao.

databases:
  - name: pagaai-db
    databaseName: pagaai
    user: pagaai
    plan: free

services:
  - type: web
    name: paga-ai
    runtime: docker
    dockerfilePath: ./pagaai/Dockerfile
    dockerContext: ./pagaai
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: pagaai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pagaai-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pagaai-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pagaai-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pagaai-db
          property: password
      - key: ADMIN_LOGIN
        value: HERA123
      # sync: false = o Render pergunta o valor na hora de aplicar o blueprint
      # e guarda so no painel. A senha nao entra no repositorio.
      - key: ADMIN_SENHA
        sync: false
